name: Build game

# Exports playable ASHLINE builds (Linux + Windows) with Godot 4.6.3 and attaches them as workflow artifacts.
on:
  push:
    branches: [main, master, 'claude/**', 'codex/weapon-polish']
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.3
  GODOT_TAG: 4.6.3-stable

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}

      - name: Install Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL --retry 4 -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_TAG}_linux.x86_64 godot && rm godot.zip
          curl -sSL --retry 4 -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q templates.tpz
          mv templates/linux_release.x86_64 templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe templates/version.txt ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates templates.tpz

      - name: Import assets
        run: |
          ~/godot/godot --headless --editor --path . --import || true
          # Textures extracted from the GLBs get .import files only now: cap world textures, import again.
          python3 tools/cap_textures.py
          ~/godot/godot --headless --editor --path . --import || true

      - name: Gameplay and weapon regression checks
        run: |
          set -o pipefail
          mkdir -p build/verification
          for suite in functional fp_motion_regression fp_anchors_regression viewmodel_lighting_regression weapon_trim_regression weapon_aim_regression runtime_assets_regression fp_actions_regression audio_distance_regression character_motion_regression foundry_routes_regression ragdoll_regression; do
            ~/godot/godot --headless --audio-driver Dummy --path . --script tests/${suite}.gd 2>&1 | tee build/verification/${suite}.log
            if grep -E '^(SCRIPT ERROR|ERROR):' build/verification/${suite}.log; then
              exit 1
            fi
          done

      - name: Export Linux and Windows
        run: |
          mkdir -p build/linux build/windows
          ~/godot/godot --headless --path . --export-release "Linux PC" build/linux/ASHLINE.x86_64
          ~/godot/godot --headless --path . --export-release "Windows PC" build/windows/ASHLINE.exe
          python3 tools/package_builds.py --linux-dir build/linux --windows-dir build/windows --revision "$GITHUB_SHA" --no-archives
          ls -la build/linux build/windows

      - name: Verify runtime assets in the exported build
        run: |
          set -o pipefail
          # A load()ed asset that the exporter skipped only fails inside the shipped
          # binary, so this runs there: textures, fx, shaders, fonts, scripts, every
          # sound, the camouflage maps, all weapon sets and both soldiers.
          build/linux/ASHLINE.x86_64 --headless --audio-driver Dummy -- --verify-assets 2>&1 | tee build/verification/native-assets.log
          if grep -E '^(SCRIPT ERROR|ERROR):|FAIL' build/verification/native-assets.log; then
            exit 1
          fi
          grep -q '^EXPORTED_ASSETS PASS' build/verification/native-assets.log

      - name: Smoke test (Linux build runs a bot match headless)
        run: |
          set -o pipefail
          timeout 600 build/linux/ASHLINE.x86_64 --headless --audio-driver Dummy -- --bot-test --seed=801 --matches=1 2>&1 | tee build/verification/native-bot.log
          if grep -E '^(SCRIPT ERROR|ERROR):' build/verification/native-bot.log; then
            exit 1
          fi

      - name: Publish downloadable PC prerelease (manual build)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/package_builds.py --linux-dir build/linux --windows-dir build/windows --revision "$GITHUB_SHA"
          python3 tools/publish_build_release.py --repo "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'workflow_dispatch'
        with:
          name: ASHLINE-verification
          path: build/verification

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: ASHLINE-linux
          path: build/linux
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: ASHLINE-windows
          path: build/windows
